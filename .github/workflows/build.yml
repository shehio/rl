name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.13

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify imports
      run: |
        echo "Verifying all modules can be imported..."
        python -c "import torch; print('PyTorch:', torch.__version__)"
        python -c "import gymnasium; print('Gymnasium:', gymnasium.__version__)"
        python -c "import stable_baselines3; print('Stable Baselines3:', stable_baselines3.__version__)"
        python -c "import chess; print('Chess:', chess.__version__)"
        echo "All core dependencies imported successfully!"

    - name: Check project structure
      run: |
        echo "Verifying project structure..."
        test -f requirements.txt || exit 1
        test -f init.sh || exit 1
        test -d atari || exit 1
        test -d chess || exit 1
        test -d graph-search || exit 1
        echo "Project structure verified!"
